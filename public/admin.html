<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Моды</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .input-field {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-field label {
            font-size: 0.9rem;
            color: var(--md-sys-color-outline, #aaa);
        }
        .input-field input, .input-field select, .input-field textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: var(--md-sys-color-surface, #121212);
            color: inherit;
            border: 1px solid var(--md-sys-color-outline, #444);
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="material-symbols-outlined">admin_panel_settings</span>
            <h1>Панель администратора</h1>
        </div>
        <div class="user-profile">
            <span id="adminName">Admin</span>
            <button id="logoutBtn" class="btn-download" style="padding: 6px 12px; font-size: 0.8rem;">
                <span class="material-symbols-outlined">logout</span> Выйти
            </button>
        </div>
    </header>

    <main class="container" style="max-width: 800px; margin: 20px auto; padding: 0 16px;">
        
        <!-- Форма публикации мода -->
        <section class="admin-card" style="background: var(--md-sys-color-surface-container, #1e1e1e); padding: 20px; border-radius: 16px; margin-bottom: 24px;">
            <h2 style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                <span class="material-symbols-outlined">add_circle</span> Опубликовать мод
            </h2>
            <form id="uploadForm">
                <div class="input-field">
                    <label for="title">Название мода</label>
                    <input type="text" id="title" name="title" placeholder="Например: Super Pack" required>
                </div>
                <div class="input-field">
                    <label for="author">Автор</label>
                    <input type="text" id="author" name="author" placeholder="Имя автора" required>
                </div>
                <div class="input-field">
                    <label for="platform">Платформа</label>
                    <select id="platform" name="platform">
                        <option value="android">Android (.apk)</option>
                        <option value="windows">Windows (ПК) (.exe / .zip)</option>
                    </select>
                </div>
                <div class="input-field">
                    <label for="version">Версия</label>
                    <input type="text" id="version" name="version" placeholder="v1.0.0" required>
                </div>
                <div class="input-field">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="3" placeholder="Краткое описание мода..." required></textarea>
                </div>
                
                <!-- Поля ввода Telegram file_id -->
                <div class="input-field">
                    <label for="mainFileId">Telegram file_id основного файла</label>
                    <input type="text" id="mainFileId" name="mainFileId" placeholder="BQACAgIAAxkBAAI..." required>
                </div>
                <div class="input-field">
                    <label for="extraFileId">Telegram file_id доп. файла (необязательно)</label>
                    <input type="text" id="extraFileId" name="extraFileId" placeholder="BQACAgIAAxkBAAI...">
                </div>

                <button type="submit" class="btn-download" style="margin-top: 16px; width: 100%; justify-content: center;">
                    <span class="material-symbols-outlined">publish</span> Опубликовать
                </button>
            </form>
        </section>

        <!-- Список опубликованных модов -->
        <section class="admin-card" style="background: var(--md-sys-color-surface-container, #1e1e1e); padding: 20px; border-radius: 16px;">
            <h2 style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                <span class="material-symbols-outlined">list</span> Опубликованные моды
            </h2>
            <div id="adminModsGrid">
                <p style="color: var(--md-sys-color-outline);">Загрузка списка модов...</p>
            </div>
        </section>

    </main>

    <script src="adminscript.js"></script>
</body>
</html>
