<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCloud — Каталог модов</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="material-symbols-outlined">cloud_download</span>
            <h1>PixelCloud</h1>
        </div>
        <button id="openAuthBtn" class="btn-download" style="padding: 6px 12px; font-size: 0.85rem;">
            <span class="material-symbols-outlined">lock</span> Войти
        </button>
    </header>

    <main class="container" style="max-width: 900px; margin: 20px auto; padding: 0 16px;">
        <!-- Переключатель платформ -->
        <div class="segmented-control" style="display: flex; gap: 8px; margin-bottom: 20px;">
            <button class="segmented-btn active" data-platform="android">
                <span class="material-symbols-outlined">android</span> Android
            </button>
            <button class="segmented-btn" data-platform="pc">
                <span class="material-symbols-outlined">desktop_windows</span> Windows
            </button>
        </div>

        <!-- Сетка модов -->
        <div id="publicModsGrid" class="mods-grid">
            <p style="text-align: center; color: var(--md-sys-color-outline);">Загрузка модов...</p>
        </div>
    </main>

    <!-- Модальное окно входа -->
    <div id="authModal" class="modal" style="display: none;">
        <div class="modal-content" style="background: var(--md-sys-color-surface-container, #1e1e1e); padding: 24px; border-radius: 16px; max-width: 360px; margin: 100px auto; position: relative;">
            <button id="closeAuthBtn" style="position: absolute; right: 12px; top: 12px; background: none; border: none; color: inherit; cursor: pointer;">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2 style="margin-bottom: 16px;">Авторизация</h2>
            <form id="loginForm">
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 0.85rem;">Логин</label>
                    <input type="text" id="username" required style="width: 100%; padding: 8px; border-radius: 6px; background: #121212; color: #fff; border: 1px solid #444; box-sizing: border-box;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="font-size: 0.85rem;">Пароль</label>
                    <input type="password" id="password" required style="width: 100%; padding: 8px; border-radius: 6px; background: #121212; color: #fff; border: 1px solid #444; box-sizing: border-box;">
                </div>
                <p id="errorMsg" style="color: #ffb4ab; display: none; font-size: 0.85rem; margin-bottom: 12px;"></p>
                <button type="submit" class="btn-download" style="width: 100%; justify-content: center;">Войти</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
